[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "1.0.0"
description = "Orbit's voice agent and the API its app calls"
requires-python = ">=3.12, <3.15"

dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "google-auth-oauthlib>=1.5.0",
    "livekit-agents[google,mcp]~=1.8",
    "livekit-api>=1.2.1",
    "livekit-plugins-ai-coustics~=0.3",
    "markdown-it-py>=4.2.0",
    "python-dotenv",
    "redis>=6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
